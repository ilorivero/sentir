[project]
name = "sentir"
version = "0.2.0"
description = "SENTIR - agente EEG da estacao: Meower (BrainFlow) sincronizada com o monitor_oasis"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "pyarrow>=15",
  "websockets>=12",
  "pyyaml>=6",
  "pydantic>=2",
]

[project.optional-dependencies]
brainflow = ["brainflow"]   # instale o build local com MEOWER_BOARD (ver brainflow/README.md)
analysis = ["pandas>=2", "scipy>=1.11", "mne>=1.6", "pyxdf"]
dev = ["pytest>=8", "httpx", "pyserial>=3.5"]

[project.scripts]
sentir-agent = "sentir.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
